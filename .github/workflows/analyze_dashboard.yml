name: Analyze Dashboard

on:
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC, after fetch_bp (06:00)
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch data and run analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import json, urllib.request, urllib.error, base64, re, time
          from datetime import datetime, timezone

          REPO = "Matias1661/Dashboards"
          GH_TOKEN = __import__('os').environ['GH_TOKEN']
          ANTHROPIC_KEY = __import__('os').environ['ANTHROPIC_API_KEY']

          def gh_get(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/contents/{path}",
                  headers={"Authorization": f"token {GH_TOKEN}", "Accept": "application/vnd.github+json"}
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def gh_put(path, content_bytes, sha, message):
              payload = json.dumps({
                  "message": message,
                  "content": base64.b64encode(content_bytes).decode(),
                  "sha": sha
              }).encode()
              for attempt in range(5):
                  try:
                      req = urllib.request.Request(
                          f"https://api.github.com/repos/{REPO}/contents/{path}",
                          data=payload, method="PUT",
                          headers={"Authorization": f"token {GH_TOKEN}", "Content-Type": "application/json"}
                      )
                      with urllib.request.urlopen(req) as r:
                          return json.loads(r.read())
                  except urllib.error.HTTPError as e:
                      if attempt == 4: raise
                      time.sleep(2 ** attempt)

          # Fetch data files
          renpho = json.loads(base64.b64decode(gh_get("renpho_data.json")["content"]))
          hevy   = json.loads(base64.b64decode(gh_get("hevy_data.json")["content"]))
          bp     = json.loads(base64.b64decode(gh_get("bp_data.json")["content"]))

          # Prepare compact summaries for Claude
          measurements = renpho.get("measurements", [])
          last8 = measurements[-8:] if len(measurements) >= 8 else measurements
          renpho_summary = [
              {"date": r["date"], "weight": r["weight"],
               "skeletal_muscle": round(r["skeletal_muscle"], 2),
               "body_fat": r["body_fat"], "visceral_fat": r["visceral_fat"],
               "water": r["water"]}
              for r in last8
          ]

          workouts = hevy.get("workouts", [])
          hevy_summary = []
          for w in workouts[-8:]:
              vol = sum(
                  (s.get("weight_kg") or 0) * (s.get("reps") or 0)
                  for ex in w.get("exercises", [])
                  for s in ex.get("sets", [])
                  if s.get("type") != "warmup"
              )
              hevy_summary.append({
                  "date": w["start_time"][:10],
                  "title": w.get("title", ""),
                  "volume_kg": round(vol),
                  "sets": sum(
                      1 for ex in w.get("exercises", [])
                      for s in ex.get("sets", [])
                      if s.get("type") != "warmup"
                  )
              })

          bp_readings = bp.get("readings", [])
          bp_nocafe = [r for r in bp_readings if r.get("tipo") == "nocafe"][-10:]

          baseline = {"weight": 86.20, "skeletal_muscle": 59.22, "body_fat": 27.7}
          today = datetime.now(timezone.utc).strftime("%-d %b %Y")

          cycle_start = "2026-03-23"
          tamo_start  = "2026-05-14"
          protocol    = "Sem 11+: Testo 3cm/sem + Masteron 1cm/sem + Tamoxifeno. Sem 14-16: Testo + Tamoxifeno. Sem 17-20: PCT (HCG + Tamoxifeno + Clomid)."

          prompt = f"""Eres el agente de análisis del Plan Karat, ciclo de 20 semanas iniciado el {cycle_start}.

PROTOCOLO ACTIVO: {protocol}
Tamoxifeno iniciado: {tamo_start}
Baseline ciclo: peso {baseline['weight']} kg / músculo {baseline['skeletal_muscle']} kg / GC {baseline['body_fat']}%

DATOS RENPHO (últimas mediciones):
{json.dumps(renpho_summary, ensure_ascii=False)}

DATOS HEVY (últimas sesiones, volumen excluye warmup):
{json.dumps(hevy_summary, ensure_ascii=False)}

TENSIÓN ARTERIAL nocafé (últimas lecturas):
{json.dumps(bp_nocafe, ensure_ascii=False)}

Genera un análisis conciso en HTML (sin etiquetas html/body/head). Usa exactamente esta estructura:

<p style="font-weight:600;color:var(--text);margin-bottom:10px">Semana XX — {today}</p>

<p style="margin-bottom:10px"><span style="font-weight:600;color:var(--text);border-bottom:1px solid var(--border2);display:inline-block;margin-bottom:3px">Composición corporal</span><br>
[análisis composición: últimas métricas, deltas vs baseline, tendencia]</p>

<p style="margin-bottom:10px"><span style="font-weight:600;color:var(--text);border-bottom:1px solid var(--border2);display:inline-block;margin-bottom:3px">Entrenamiento</span><br>
[análisis entrenamiento: volumen, frecuencia, tendencia]</p>

<p style="margin-bottom:10px"><span style="font-weight:600;color:var(--text);border-bottom:1px solid var(--border2);display:inline-block;margin-bottom:3px">Tensión arterial</span><br>
[análisis TA: media reciente, tendencia, alertas si sistólica nocafé >130 sostenida]</p>

<p style="margin-bottom:6px"><span style="font-weight:600;color:var(--text);border-bottom:1px solid var(--border2);display:inline-block;margin-bottom:3px">Recomendaciones</span><br>
1. [acción concreta]<br>
2. [acción concreta]<br>
3. [acción concreta]<br>
4. [acción concreta]</p>

<p style="margin-bottom:0;padding-top:8px;border-top:1px solid var(--border2);color:var(--text3);font-size:11px">Para actualizar este análisis, escribe <strong style="color:var(--text2)">"Analizar Dashboard"</strong> en el chat con Claude.</p>

Reglas:
- Sin markdown, sin bloques de código, solo HTML puro
- Datos concretos (cifras, fechas), sin frases genéricas
- Calcula semana del ciclo: semanas desde {cycle_start} hasta hoy
- Deltas siempre vs baseline indicado arriba
- Tono directo, profesional, sin emojis"""

          # Call Claude API
          api_payload = json.dumps({
              "model": "claude-sonnet-4-20250514",
              "max_tokens": 1500,
              "messages": [{"role": "user", "content": prompt}]
          }).encode()

          api_req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=api_payload,
              method="POST",
              headers={
                  "x-api-key": ANTHROPIC_KEY,
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json"
              }
          )
          with urllib.request.urlopen(api_req) as r:
              api_resp = json.loads(r.read())

          analysis_html = api_resp["content"][0]["text"].strip()

          # Fetch dashboard and inject
          dash_resp = gh_get("plan_karat_dashboard.html")
          dash_sha  = dash_resp["sha"]
          dash_html = base64.b64decode(dash_resp["content"]).decode()

          date_str = datetime.now(timezone.utc).strftime("%-d %b %Y").lower()
          # Format: "5 jun 2026"
          months = {"jan":"ene","feb":"feb","mar":"mar","apr":"abr","may":"may",
                    "jun":"jun","jul":"jul","aug":"ago","sep":"sep","oct":"oct",
                    "nov":"nov","dec":"dic"}
          for en, es in months.items():
              date_str = date_str.replace(en, es)
          date_label = f"Actualizado: {date_str}"

          dash_html = re.sub(
              r'(<span[^>]*id="claudeAnalysisDate"[^>]*>)[^<]*(</span>)',
              r'\g<1>' + date_label + r'\g<2>',
              dash_html
          )
          dash_html = re.sub(
              r'(<div[^>]*id="claudeAnalysisBody"[^>]*>).*?(</div>)',
              r'\g<1>' + analysis_html.replace('\\', '\\\\') + r'\g<2>',
              dash_html,
              flags=re.DOTALL
          )

          gh_put(
              "plan_karat_dashboard.html",
              dash_html.encode(),
              dash_sha,
              f"Auto-análisis dashboard {date_label} [skip ci]"
          )
          print(f"Done. Injected analysis dated: {date_label}")
          EOF

name: Analyze Dashboard

on:
  schedule:
    - cron: '30 6 * * *'  # 06:30 UTC daily
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -o pipefail
          python3 scripts/analyze_dashboard.py
          EXIT=$?
          echo "Exit code: $EXIT"
          exit $EXIT

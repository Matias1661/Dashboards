name: Diagnose Hevy Templates
on: [workflow_dispatch]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Test exercise_templates endpoint
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: |
          python3 - <<'PYEOF2'
          import requests, os, json
          key = os.environ["HEVY_API_KEY"]
          h = {"api-key": key}
          out = []

          r = requests.get("https://api.hevyapp.com/v1/exercise_templates?page=1&pageSize=3", headers=h, timeout=15)
          out.append(f"LIST status={r.status_code}")
          try:
              d = r.json()
              out.append(json.dumps(d)[:800])
          except:
              out.append(r.text[:400])

          for tid in ["7EB3F7C3", "3601968B"]:
              r2 = requests.get(f"https://api.hevyapp.com/v1/exercise_templates/{tid}", headers=h, timeout=15)
              out.append(f"GET {tid} status={r2.status_code}: {r2.text[:300]}")

          with open("hevy_template_diag.json", "w") as f:
              json.dump(out, f, indent=2)
          print("Done")
          PYEOF2
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hevy_template_diag.json
          git diff --staged --quiet || git commit -m "diag: hevy templates test"
          git push

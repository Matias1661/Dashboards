name: Fetch BP Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Fetch BP from Notion database
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python3 - <<'PYEOF2'
          import requests, json, os, sys
          from datetime import datetime, timezone
          from collections import defaultdict

          token = os.environ.get('NOTION_TOKEN', '').strip()
          if not token:
              print("NOTION_TOKEN not set — skipping")
              sys.exit(0)

          # Base de datos Tensión Arterial — ID: 4144082e-b207-406f-9b16-90cb20638235
          DB_ID  = '4144082e-b207-406f-9b16-90cb20638235'
          HEADERS = {
              'Authorization': f'Bearer {token}',
              'Notion-Version': '2022-06-28',
              'Content-Type': 'application/json',
          }
          TIPO_MAP = {'Sin café': 'nocafe', 'Con café': 'cafe', 'Chequeo médico': 'medico'}
          MONTH_ES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']

          def fmt_label(iso_date):
              from datetime import date
              d = date.fromisoformat(iso_date)
              return f"{d.day} {MONTH_ES[d.month-1]}"

          # Query database sorted by Fecha ascending
          resp = requests.post(
              f'https://api.notion.com/v1/databases/{DB_ID}/query',
              headers=HEADERS,
              json={"sorts": [{"property": "Fecha", "direction": "ascending"}]},
              timeout=15
          )
          resp.raise_for_status()
          results = resp.json().get('results', [])
          print(f"Rows fetched: {len(results)}")

          readings = []
          for row in results:
              props = row['properties']
              fecha_val = props.get('Fecha', {}).get('date')
              if not fecha_val or not fecha_val.get('start'): continue
              sist  = props.get('Sistólica', {}).get('number')
              diast = props.get('Diastólica', {}).get('number')
              if sist is None or diast is None: continue
              cond_val = props.get('Condición', {}).get('select')
              cond  = cond_val['name'] if cond_val else 'Sin café'
              tipo  = TIPO_MAP.get(cond, 'nocafe')
              label = fmt_label(fecha_val['start'])
              readings.append({'d': label, 'sist': int(sist), 'diast': int(diast), 'tipo': tipo})

          # Average same-day + same-tipo readings
          grouped = defaultdict(list)
          for r in readings:
              grouped[(r['d'], r['tipo'])].append(r)
          bp_final = [
              {'d': d, 'sist': round(sum(r['sist'] for r in g)/len(g)),
               'diast': round(sum(r['diast'] for r in g)/len(g)), 'tipo': tipo}
              for (d, tipo), g in grouped.items()
          ]

          with open('bp_data.json', 'w') as f:
              json.dump({
                  'fetched_at': datetime.now(timezone.utc).isoformat(),
                  'readings': bp_final,
              }, f, ensure_ascii=False, indent=2)
          print(f"Done — {len(bp_final)} averaged readings saved")
          PYEOF2

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bp_data.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update bp_data.json [$(date -u '+%Y-%m-%d %H:%M UTC')] [skip ci]"
          git push --force-with-lease

name: Fetch BP Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Fetch BP from Notion database
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python3 - <<'PYEOF2'
          import requests, json, os, sys
          from datetime import datetime, timezone
          from collections import defaultdict

          token = os.environ.get('NOTION_TOKEN', '').strip()
          if not token:
              print("NOTION_TOKEN not set — skipping")
              sys.exit(0)

          DB_ID  = '4144082e-b207-406f-9b16-90cb20638235'
          HEADERS = {
              'Authorization': f'Bearer {token}',
              'Notion-Version': '2022-06-28',
              'Content-Type': 'application/json',
          }
          MEDICO_DATE = '2026-05-14'  # chequeo medico inicial que origino el seguimiento (Condicion eliminada del DB)
          MONTH_ES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']

          def fmt_label(iso_date):
              from datetime import date
              d = date.fromisoformat(iso_date)
              return f"{d.day} {MONTH_ES[d.month-1]}"

          resp = requests.post(
              f'https://api.notion.com/v1/databases/{DB_ID}/query',
              headers=HEADERS,
              json={"sorts": [{"property": "Fecha", "direction": "ascending"}]},
              timeout=15
          )
          resp.raise_for_status()
          results = resp.json().get('results', [])
          print(f"Rows fetched: {len(results)}")

          readings = []
          for row in results:
              props = row['properties']
              fecha_val = props.get('Fecha', {}).get('date')
              if not fecha_val or not fecha_val.get('start'): continue
              sist  = props.get('Sistólica', {}).get('number')
              diast = props.get('Diastólica', {}).get('number')
              if sist is None or diast is None: continue
              fecha_iso = fecha_val['start'][:10]
              tipo  = 'medico' if fecha_iso == MEDICO_DATE else 'nocafe'
              label = fmt_label(fecha_val['start'])
              readings.append({'d': label, 'sist': int(sist), 'diast': int(diast), 'tipo': tipo})

          grouped = defaultdict(list)
          for r in readings:
              grouped[(r['d'], r['tipo'])].append(r)
          bp_final = [
              {'d': d, 'sist': round(sum(r['sist'] for r in g)/len(g)),
               'diast': round(sum(r['diast'] for r in g)/len(g)), 'tipo': tipo}
              for (d, tipo), g in grouped.items()
          ]

          with open('bp_data.json', 'w') as f:
              json.dump({
                  'fetched_at': datetime.now(timezone.utc).isoformat(),
                  'readings': bp_final,
              }, f, ensure_ascii=False, indent=2)
          print(f"Done — {len(bp_final)} averaged readings saved")
          PYEOF2

      - name: Push via GitHub API
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PYEOF3'
          import base64, json, urllib.request, urllib.error, os, sys, time
          token = os.environ['GH_PAT']
          repo  = 'Matias1661/Dashboards'
          fname = 'bp_data.json'
          if not os.path.exists(fname):
              print(f"ERROR: {fname} not found. Files: {os.listdir('.')}")
              sys.exit(1)
          with open(fname, 'rb') as f:
              new_content = base64.b64encode(f.read()).decode()
          url = f'https://api.github.com/repos/{repo}/contents/{fname}'
          from datetime import datetime, timezone
          msg = f'Update {fname} [{datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")}] [skip ci]'
          for attempt in range(5):
              try:
                  req = urllib.request.Request(url, headers={'Authorization': f'token {token}'})
                  with urllib.request.urlopen(req) as r:
                      sha = json.loads(r.read())['sha']
                  payload = json.dumps({'message': msg, 'content': new_content, 'sha': sha}).encode()
                  req2 = urllib.request.Request(url, data=payload, method='PUT',
                      headers={'Authorization': f'token {token}', 'Content-Type': 'application/json'})
                  with urllib.request.urlopen(req2) as r:
                      result = json.loads(r.read())
                      print(f"Pushed: {result['commit']['sha'][:7]}")
                      sys.exit(0)
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  print(f"Attempt {attempt+1} failed (HTTP {e.code}): {body[:200]}")
                  if attempt < 4:
                      time.sleep(3 * (attempt + 1))
          print("All retries exhausted")
          sys.exit(1)
          PYEOF3

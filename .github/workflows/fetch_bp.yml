name: Fetch BP Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Fetch BP readings from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python3 - <<'PYEOF2'
          import requests, json, os, sys
          from datetime import datetime, timezone
          from collections import defaultdict

          token = os.environ.get('NOTION_TOKEN', '').strip()
          log = []

          if not token:
              log.append("ERROR: NOTION_TOKEN not set")
              with open('bp_debug.json', 'w') as f: json.dump({'log': log}, f, indent=2)
              sys.exit(0)

          log.append(f"Token starts with: {token[:12]}...")

          PAGE_ID = '36333ce5-0e68-81a5-895c-f111d0ab45af'
          headers = {
              'Authorization': f'Bearer {token}',
              'Notion-Version': '2022-06-28',
          }

          # Fetch top-level blocks
          url = f'https://api.notion.com/v1/blocks/{PAGE_ID}/children?page_size=100'
          r = requests.get(url, headers=headers, timeout=15)
          log.append(f"GET blocks/{PAGE_ID}/children → {r.status_code}")
          if r.status_code != 200:
              log.append(f"Error body: {r.text[:500]}")
              with open('bp_debug.json', 'w') as f: json.dump({'log': log}, f, indent=2)
              sys.exit(0)

          blocks = r.json().get('results', [])
          log.append(f"Top-level blocks: {len(blocks)}")
          for b in blocks:
              log.append(f"  type={b.get('type')} id={b.get('id','?')[:8]} has_children={b.get('has_children')}")

          # Find table blocks
          def get_blocks(block_id):
              resp = requests.get(
                  f'https://api.notion.com/v1/blocks/{block_id}/children?page_size=100',
                  headers=headers, timeout=15)
              log.append(f"  get_blocks({block_id[:8]}) → {resp.status_code}")
              if resp.status_code != 200:
                  log.append(f"  body: {resp.text[:200]}")
                  return []
              return resp.json().get('results', [])

          def find_tables(blocks, depth=0):
              tables = []
              for b in blocks:
                  btype = b.get('type', '')
                  if btype == 'table':
                      tables.append(b)
                  elif b.get('has_children') and btype not in ('table', 'table_row'):
                      children = get_blocks(b['id'])
                      tables.extend(find_tables(children, depth+1))
              return tables

          tables = find_tables(blocks)
          log.append(f"Tables found: {len(tables)}")

          def cell_text(cell):
              return ''.join(t.get('plain_text', '') for t in cell)

          MONTH_MAP = {str(i): i for i in range(1, 13)}
          MONTH_ES  = {1:'ene',2:'feb',3:'mar',4:'abr',5:'may',6:'jun',
                       7:'jul',8:'ago',9:'sep',10:'oct',11:'nov',12:'dic'}

          bp_readings = []
          for table in tables:
              rows = get_blocks(table['id'])
              log.append(f"Table rows: {len(rows)}")
              for i, row in enumerate(rows):
                  if i == 0: continue
                  cells = row.get('table_row', {}).get('cells', [])
                  log.append(f"  row {i}: cells={len(cells)} raw={[cell_text(c) for c in cells[:3]]}")
                  if len(cells) < 3: continue
                  fecha = cell_text(cells[0]).strip()
                  sist  = cell_text(cells[1]).strip()
                  diast = cell_text(cells[2]).strip()
                  notas = cell_text(cells[4]).strip().lower() if len(cells) > 4 else ''
                  if not sist.isdigit() or not diast.isdigit(): continue
                  parts = fecha.replace(' ', '').split('/')
                  if len(parts) == 2:
                      d, m = parts[0], parts[1]
                      mo = MONTH_MAP.get(m)
                      if mo:
                          label = f"{d} {MONTH_ES[mo]}"
                          tipo  = ('medico'  if any(w in notas for w in ('médico','medico','aspy','chequeo')) else
                                   'nocafe'  if any(w in notas for w in ('sin café','sin cafe')) else
                                   'cafe'    if any(w in notas for w in ('café','cafe')) else
                                   'nocafe')
                          bp_readings.append({'d': label, 'sist': int(sist), 'diast': int(diast), 'tipo': tipo})

          grouped = defaultdict(list)
          for r in bp_readings: grouped[(r['d'], r['tipo'])].append(r)
          bp_final = [
              {'d': d, 'sist': round(sum(r['sist'] for r in g)/len(g)),
               'diast': round(sum(r['diast'] for r in g)/len(g)), 'tipo': tipo}
              for (d, tipo), g in grouped.items()
          ]
          bp_final.sort(key=lambda r: r['d'])

          log.append(f"Final readings: {len(bp_final)}")

          with open('bp_data.json', 'w') as f:
              json.dump({'fetched_at': datetime.now(timezone.utc).isoformat(), 'readings': bp_final}, f, ensure_ascii=False, indent=2)
          with open('bp_debug.json', 'w') as f:
              json.dump({'log': log}, f, ensure_ascii=False, indent=2)
          PYEOF2

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bp_data.json bp_debug.json
          git diff --staged --quiet || git commit -m "Update BP data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

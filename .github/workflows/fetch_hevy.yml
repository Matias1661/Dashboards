name: Fetch Hevy Data

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Fetch Hevy workouts + exercise templates
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: |
          python3 - <<'PYEOF2'
          import requests, json, os
          from datetime import datetime, timezone

          api_key = os.environ['HEVY_API_KEY']
          headers = {'api-key': api_key}

          # 1. Fetch all workouts (paginated)
          all_workouts = []
          page = 1
          while True:
              resp = requests.get(
                  f'https://api.hevyapp.com/v1/workouts?page={page}&pageSize=10',
                  headers=headers, timeout=15)
              resp.raise_for_status()
              data = resp.json()
              all_workouts.extend(data.get('workouts', []))
              if page >= data.get('page_count', 1):
                  break
              page += 1

          # 2. Fetch exercise templates only for IDs present in workouts
          template_ids = {
              ex.get('exercise_template_id')
              for w in all_workouts
              for ex in w.get('exercises', [])
              if ex.get('exercise_template_id')
          }
          templates = {}
          for tid in template_ids:
              resp = requests.get(
                  f'https://api.hevyapp.com/v1/exercise_templates/{tid}',
                  headers=headers, timeout=15)
              if resp.status_code == 200:
                  t = resp.json()
                  templates[tid] = {
                      'primary_muscle_group':    t.get('primary_muscle_group'),
                      'secondary_muscle_groups': t.get('secondary_muscle_groups', []),
                  }

          # 3. Merge muscle data into exercises
          for w in all_workouts:
              for ex in w.get('exercises', []):
                  tid = ex.get('exercise_template_id')
                  if tid and tid in templates:
                      ex['primary_muscle_group']    = templates[tid]['primary_muscle_group']
                      ex['secondary_muscle_groups'] = templates[tid]['secondary_muscle_groups']

          with open('hevy_data.json', 'w') as f:
              json.dump({
                  'fetched_at':     datetime.now(timezone.utc).isoformat(),
                  'total_workouts': len(all_workouts),
                  'workouts':       all_workouts,
              }, f)

          print(f"Done: {len(all_workouts)} workouts, {len(templates)} templates merged")
          PYEOF2

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hevy_data.json
          git diff --staged --quiet || git commit -m "Update hevy_data.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

name: Fetch Hevy Data

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC morning
    - cron: '0 21 * * *'  # 21:00 UTC = 23:00h Madrid (CEST)
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Hevy workouts + exercise templates
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: |
          python3 - <<'PYEOF2'
          import requests, json, os
          from datetime import datetime, timezone

          api_key = os.environ['HEVY_API_KEY']
          headers = {'api-key': api_key}

          all_workouts = []
          page = 1
          while True:
              resp = requests.get(
                  f'https://api.hevyapp.com/v1/workouts?page={page}&pageSize=10',
                  headers=headers, timeout=15)
              resp.raise_for_status()
              data = resp.json()
              all_workouts.extend(data.get('workouts', []))
              if page >= data.get('page_count', 1):
                  break
              page += 1

          template_ids = {
              ex.get('exercise_template_id')
              for w in all_workouts
              for ex in w.get('exercises', [])
              if ex.get('exercise_template_id')
          }
          templates = {}
          for tid in template_ids:
              resp = requests.get(
                  f'https://api.hevyapp.com/v1/exercise_templates/{tid}',
                  headers=headers, timeout=15)
              if resp.status_code == 200:
                  t = resp.json()
                  templates[tid] = {
                      'primary_muscle_group':    t.get('primary_muscle_group'),
                      'secondary_muscle_groups': t.get('secondary_muscle_groups', []),
                  }

          for w in all_workouts:
              for ex in w.get('exercises', []):
                  tid = ex.get('exercise_template_id')
                  if tid and tid in templates:
                      ex['primary_muscle_group']    = templates[tid]['primary_muscle_group']
                      ex['secondary_muscle_groups'] = templates[tid]['secondary_muscle_groups']

          with open('hevy_data.json', 'w') as f:
              json.dump({
                  'fetched_at':     datetime.now(timezone.utc).isoformat(),
                  'total_workouts': len(all_workouts),
                  'workouts':       all_workouts,
              }, f)

          print(f"Done: {len(all_workouts)} workouts, {len(templates)} templates merged")
          PYEOF2

      - name: Push via GitHub API
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          FNAME: hevy_data.json
        run: |
          python3 - <<'PYPUSH'
          import base64, json, urllib.request, urllib.error, os, sys, time
          from datetime import datetime, timezone
          token = os.environ['GH_PAT']
          repo  = 'Matias1661/Dashboards'
          fname = os.environ['FNAME']
          if not os.path.exists(fname):
              print(f"ERROR: {fname} not found. Files: {os.listdir('.')}")
              sys.exit(1)
          new_bytes = open(fname, 'rb').read()

          def canonical(b):
              # JSON sin fetched_at, serializado de forma estable, para detectar cambios reales
              try:
                  d = json.loads(b)
                  d.pop('fetched_at', None)
                  return json.dumps(d, sort_keys=True)
              except Exception:
                  return None

          url = f'https://api.github.com/repos/{repo}/contents/{fname}'
          msg = f'Update {fname} [{datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")}] [skip ci]'
          for attempt in range(5):
              try:
                  req = urllib.request.Request(url, headers={'Authorization': f'token {token}'})
                  with urllib.request.urlopen(req) as r:
                      cur = json.loads(r.read())
                  sha = cur['sha']
                  cur_canon = canonical(base64.b64decode(cur.get('content', '') or ''))
                  if cur_canon is not None and cur_canon == canonical(new_bytes):
                      print(f"Sin cambios reales en {fname} (solo fetched_at) — commit omitido")
                      sys.exit(0)
                  payload = json.dumps({'message': msg,
                                        'content': base64.b64encode(new_bytes).decode(),
                                        'sha': sha}).encode()
                  req2 = urllib.request.Request(url, data=payload, method='PUT',
                      headers={'Authorization': f'token {token}', 'Content-Type': 'application/json'})
                  with urllib.request.urlopen(req2) as r:
                      result = json.loads(r.read())
                      print(f"Pushed: {result['commit']['sha'][:7]}")
                      sys.exit(0)
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  print(f"Attempt {attempt+1} failed (HTTP {e.code}): {body[:200]}")
                  if attempt < 4:
                      time.sleep(3 * (attempt + 1))
          print("All retries exhausted")
          sys.exit(1)
          PYPUSH

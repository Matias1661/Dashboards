name: Fetch Renpho Data

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install dependencies
        run: pip install pycryptodome --break-system-packages

      - name: Fetch Renpho measurements
        env:
          RENPHO_EMAIL: ${{ secrets.RENPHO_EMAIL }}
          RENPHO_PASSWORD: ${{ secrets.RENPHO_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import os, json, base64, requests
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from Crypto.Cipher import AES
          from Crypto.Util.Padding import pad, unpad

          KEY = b'ed*wijdi$h6fe3ew'
          API_BASE = 'https://cloud.renpho.com'
          TZ = ZoneInfo('Europe/Madrid')

          def encrypt(data=None, empty=False):
              cipher = AES.new(KEY, AES.MODE_ECB)
              raw = b'' if empty else json.dumps(data or {}).encode()
              return base64.b64encode(cipher.encrypt(pad(raw, AES.block_size))).decode()

          def decrypt(enc):
              cipher = AES.new(KEY, AES.MODE_ECB)
              return unpad(cipher.decrypt(base64.b64decode(enc)), AES.block_size).decode()

          def api_post(path, session=None, data=None, empty=False):
              headers = {'Content-Type': 'application/json'}
              if session:
                  headers.update({
                      'token': session['token'], 'userId': session['userId'],
                      'appVersion': '7.0.0', 'platform': 'android'
                  })
              r = requests.post(
                  f'{API_BASE}/{path}',
                  headers=headers,
                  json={'encryptData': encrypt(data, empty=empty)},
                  timeout=15
              )
              r.raise_for_status()
              resp = r.json()
              if resp.get('code') != 101:
                  raise RuntimeError(f"API error [{path}]: code={resp.get('code')} msg={resp.get('msg')}")
              return json.loads(decrypt(resp['data']))

          # --- Authenticate ---
          login_data = api_post('renpho-aggregation/user/login', data={
              'questionnaire': {},
              'login': {
                  'password': os.environ['RENPHO_PASSWORD'],
                  'areaCode': 'US', 'appRevision': '7.0.0',
                  'cellphoneType': 'MCP-Server', 'systemType': '11',
                  'email': os.environ['RENPHO_EMAIL'], 'platform': 'android'
              },
              'bindingList': {'deviceTypes': ['2']}
          })
          login = login_data['login']
          session = {'token': login['token'], 'userId': str(login['id'])}
          print(f"Login OK: {login.get('email')}")

          # --- Get scale info ---
          device_data = api_post('renpho-aggregation/device/count', session=session, empty=True)
          scales = device_data.get('scale', [])
          if not scales:
              raise RuntimeError("No scale devices found")
          table_name = scales[0]['tableName']
          user_ids = [str(uid) for uid in scales[0].get('userIds', [])]
          print(f"Scale: {table_name} | userIds: {user_ids}")

          # --- Fetch measurements (paginated, up to 600 entries) ---
          all_raw = []
          PAGE_SIZE = 200
          for page_num in range(1, 4):
              entries = api_post(
                  'RenphoHealth/scale/queryAllMeasureDataList',
                  session=session,
                  data={'pageNum': page_num, 'pageSize': PAGE_SIZE,
                        'userIds': user_ids, 'tableName': table_name}
              )
              if not isinstance(entries, list):
                  entries = []
              all_raw.extend(entries)
              print(f"  Page {page_num}: {len(entries)} entries")
              if len(entries) < PAGE_SIZE:
                  break

          # --- Deduplicate by date, keep most recent measurement per day ---
          by_date = {}
          for m in all_raw:
              ts = int(m.get('timeStamp', 0))
              if not ts:
                  continue
              date_str = datetime.fromtimestamp(ts, tz=TZ).strftime('%Y-%m-%d')
              if date_str not in by_date or ts > by_date[date_str]['time_stamp']:
                  by_date[date_str] = {
                      'date': date_str,
                      'time_stamp': ts,
                      'weight': m.get('weight'),
                      'bmi': m.get('bmi'),
                      'body_fat': m.get('bodyfat'),
                      'muscle': m.get('muscle'),
                      'water': m.get('water'),
                      'bone': m.get('bone'),
                      'bmr': m.get('bmr'),
                      'visceral_fat': m.get('visfat'),
                      'protein': m.get('protein'),
                      'body_age': m.get('bodyage'),
                      'subcutaneous_fat': m.get('subfat'),
                      'skeletal_muscle': m.get('sinew'),
                  }

          measurements = sorted(by_date.values(), key=lambda x: x['date'])
          print(f"Unique days: {len(measurements)}")

          with open('renpho_data.json', 'w') as f:
              json.dump({
                  'fetched_at': datetime.now(timezone.utc).isoformat(),
                  'total_measurements': len(measurements),
                  'measurements': measurements
              }, f, indent=2)

          print("Done — renpho_data.json saved")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add renpho_data.json
          git diff --staged --quiet || git commit -m "Update renpho_data.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
